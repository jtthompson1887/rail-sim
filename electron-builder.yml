appId: com.jordanthompson.railsim
productName: Rail Sim
asar: true
directories:
  output: releases
files:
  - dist/client/**
  - native/electron/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
